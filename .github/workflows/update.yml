name: Обновление данных дашборда

on:
  schedule:
    # Раз в сутки в полночь по Москве. МСК = UTC+3, значит нужен 21:00 UTC
    # предыдущего дня. GitHub понимает только UTC, поэтому указываем 21:00.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 20 доменов x 2 базы x 2 отчёта при паузе 0,6 с — это примерно 5 минут.
    timeout-minutes: 30

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать данные из Keys.so
        env:
          KEYSO_TOKEN: ${{ secrets.KEYSO_TOKEN }}
        run: python3 scripts/fetch.py

      - name: Проверить данные
        run: python3 scripts/validate.py

      - name: Сохранить снимок в репозиторий
        run: |
          git config user.name  "seo-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/archive
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
            exit 0
          fi
          git commit -m "Данные дашборда: $(date -u '+%d.%m.%Y %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Повтор push, попытка $attempt"
            sleep 5
          done
